server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml
             font/ttf font/otf application/x-font-ttf application/vnd.ms-fontobject;

  # 🔴 이게 없으면 압축이 통째로 안 걸린다.
  # nginx 는 Via 헤더가 붙은 요청을 "프록시 요청"으로 보고, gzip_proxied 기본값 off 에서는
  # 압축을 건너뛴다. 이 서비스도 Firebase Hosting 뒤에 있어 모든 요청에 Via 가 붙으므로
  # 기본값 그대로면 번들이 무압축으로 나간다 (birdieup-app 운영 배포본에서 실측 확인한 것과 같은 문제).
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_vary on;

  # 해시 붙은 정적 에셋은 장기 캐시. Vite 는 번들·CSS·이미지를 전부 dist/assets/ 로 내며
  # 파일명에 내용 해시가 박혀 있어 immutable 이 안전하다.
  #
  # 이 블록이 없으면 location / 로 떨어지는데, 그러면 Cache-Control 이 없어
  # Firebase Hosting 이 `private` 를 붙인다. 캐시가 전혀 안 걸려 재방문마다 번들을 다시 받고,
  # Hosting 무료 전송량(360MB/일)이 금방 소진된다.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # 외부 업타임 감시용. `/` 로 감시하면 매번 SPA HTML 전체를 받아오므로 따로 둔다.
  # WAS 의 /health 와 경로를 맞춰 놓았다 (WAS 는 `/healthz` 를 Google Frontend 가
  # 가로채는 문제가 있어 별칭을 뒀고, 여기는 그 문제와 무관하지만 이름을 통일한다).
  # 정적 서빙이라 확인할 의존성이 없어 200 만 돌려준다.
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }

  # SPA 폴백. 라우팅은 react-router 가 브라우저에서 하므로 어느 경로로 들어와도 index.html 을 준다.
  location / {
    # 🔴 HTML 은 반드시 재검증시킨다(`no-cache` 는 "저장은 하되 매번 물어봐라" 다. ETag 로 304).
    #
    # 여기에 어느 번들을 쓸지가 파일명으로 박혀 있고, 그 번들은 `immutable` 로 1년 캐시된다.
    # 그래서 이 파일이 낡으면 배포한 코드가 새것이어도 브라우저는 옛 번들을 계속 불러온다.
    # 명시하지 않으면 앞단 Hosting 이 `private` 만 붙이는데, 만료 규칙이 없어 브라우저가
    # 임의(휴리스틱)로 캐시해 며칠씩 옛 앱이 도는 일이 생긴다 — 운영에서 그렇게 나타났다.
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
