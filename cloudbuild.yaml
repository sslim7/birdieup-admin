# BirdieUp 어드민(admin.birdieup.kr) — Cloud Run 배포 파이프라인
# 실행: gcloud builds submit --config cloudbuild.yaml
# 트리거 설정에서 substitutions 를 덮어쓸 수 있습니다.

substitutions:
  _REGION: asia-northeast3
  _REPO: birdieup             # Artifact Registry 저장소 이름
  _SERVICE: birdieup-admin    # Cloud Run 서비스 이름
  # VITE_* 는 빌드 시점에 번들로 인라인됩니다. Cloud Run 환경변수로는 전혀 먹지 않으므로
  # 반드시 여기서 --build-arg 로 넘겨야 합니다. 값이 바뀌면 이미지 재빌드가 필요합니다.
  _VITE_API_BASE_URL: https://api.birdieup.kr
  # 구글 지도 키. 저장소에 값을 적지 않고 **빌드 트리거의 substitutions 에서 덮어쓴다.**
  # 비워 두면 「장면 위치 보정」 화면이 지도 없이(좌표 직접 입력만) 동작한다.
  _VITE_GOOGLE_MAPS_API_KEY: ''

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest
      - --build-arg=VITE_API_BASE_URL=${_VITE_API_BASE_URL}
      - --build-arg=VITE_GOOGLE_MAPS_API_KEY=${_VITE_GOOGLE_MAPS_API_KEY}
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args: [push, --all-tags, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}"]

  # 🔴 이 단계는 "이미지 교체"만 합니다. 환경변수·시크릿·CPU·min-instances·
  #    --allow-unauthenticated 같은 서비스 설정 플래그를 여기에 넣지 마십시오.
  #    그 설정들의 소유자는 Terraform(birdieup-terraform)입니다. CI 가 같이 넘기면
  #    배포할 때마다 Terraform 이 만든 값을 CI 가 덮고, 다음 apply 에서 Terraform 이 되돌리는
  #    핑퐁이 생깁니다. 실제 증상은 "배포 후 설정이 사라졌다" 로 나타납니다.
  #    설정을 바꿔야 하면 Terraform 쪽을 고쳐서 apply 하십시오.
  #    (Terraform 은 image 를 lifecycle.ignore_changes 로 빼 두었으므로 반대 방향 충돌은 없습니다.)
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed

# latest 는 사람이 보기 편하라고 두는 것이고, 롤백 대상을 특정하는 것은 $COMMIT_SHA 태그입니다.
# latest 만 있으면 "어느 이미지로 되돌릴지"를 지목할 수 없습니다.
images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/${_SERVICE}:latest

# 트리거가 전용 서비스 계정(birdieup-deployer)으로 돕니다.
# 커스텀 SA 로 도는 빌드는 기본 로그 버킷에 쓸 권한이 없어, 이 옵션이 없으면
# 빌드가 시작하자마자 로그 버킷/스토리지 소스 해석 오류로 실패합니다.
options:
  logging: CLOUD_LOGGING_ONLY
